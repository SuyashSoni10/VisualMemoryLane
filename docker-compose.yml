version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: visual_memory_lane
      POSTGRES_USER: vml_user
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://vml_user:yourpassword@db:5432/visual_memory_lane
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - db
    volumes:
      - ./frames:/app/frames
    devices:
      - /dev/video0:/dev/video0

volumes:
  postgres_data: